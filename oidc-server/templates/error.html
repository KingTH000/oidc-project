<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Login Failed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .error-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 300px;
            text-align: center;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h2 {
            color: #c62828;
            margin: 10px 0;
        }

        p {
            color: #555;
            margin: 20px 0;
        }

        a {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        a:hover {
            background: #5568d3;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-icon">❌</div>
        <h2>Login Failed</h2>
        <p>Invalid username or password</p>
        <a href="javascript:history.back()">Try Again</a>
    </div>
</body>

</html>
